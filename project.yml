name: Jigsaw
options:
  bundleIdPrefix: com.vaswan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Jigsaw:
    type: application
    platform: iOS
    sources:
      - Jigsaw
    entitlements:
      path: Jigsaw/Jigsaw.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.vaswan.jigsaw]
    info:
      path: Jigsaw/Info.plist
      properties:
        CKSharingSupported: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaswan.jigsaw
        PRODUCT_NAME: Jigsaw
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UG9L8XZFD7
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Jigsaw
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
