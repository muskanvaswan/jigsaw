name: Jigsaw
options:
  bundleIdPrefix: com.vaswan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Jigsaw:
    type: application
    platform: iOS
    sources:
      - Jigsaw
    entitlements:
      path: Jigsaw/Jigsaw.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.vaswan.jigsaw]
        # The Mac app runs sandboxed: it talks to iCloud and opens pictures you pick.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        # Solving live over SharePlay.
        com.apple.developer.group-session: true
    info:
      path: Jigsaw/Info.plist
      properties:
        CKSharingSupported: true
        NSSupportsGroupActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaswan.jigsaw
        PRODUCT_NAME: Jigsaw
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UG9L8XZFD7
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # iPhone, iPad, and a Mac app built with Mac Catalyst that shares the iOS bundle ID,
        # so it's one App Store listing and one iCloud container.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Jigsaw
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
